name: Python package

on: [push]

jobs:
  build:
    # 1. 필수적인 runs-on 키를 추가했습니다.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.13]

    # 2. steps 블록을 strategy와 동일한 레벨로 올바르게 이동했습니다.
    steps:
      - uses: actions/checkout@v3

      # 3. 모든 리스트 항목 앞에 '- ' 처럼 공백을 추가했습니다.
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with flake8
        run: |
          # 파이썬 문법 오류나 정의되지 않은 이름이 있으면 빌드를 중단
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero는 모든 오류를 경고로 처리한다. 깃허브 편집기는 127자까지 표시한다.
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test with pytest
        # 4. working-directory는 이 step에만 적용되도록 올바르게 들여쓰기 했습니다.
        run: pytest
        working-directory: ./Chapter02