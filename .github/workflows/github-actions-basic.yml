name: Python package

on: [push]

jobs:
  build:
    # 1. 실행 환경을 Windows로 변경했습니다.
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: [3.11, 3.13]

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # 2. 윈도우의 기본 셸인 PowerShell을 사용하도록 명시했습니다.
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          # 3. 리눅스 명령어 'if [ -f ... ]'를 PowerShell 문법으로 변경했습니다.
          if (Test-Path -Path requirements.txt) { pip install -r requirements.txt }

      - name: Lint with flake8
        run: |
          # flake8 명령어는 Python 기반이므로 OS와 상관없이 동일하게 작동합니다.
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test with pytest
        shell: pwsh
        run: pytest
        # 4. 경로를 명확하게 지정했습니다.
        working-directory: ./Chapter02