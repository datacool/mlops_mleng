name: Python package

on: [push]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: [3.11, 3.13]

    steps:
      # 1. 코드를 내려받습니다.
      - uses: actions/checkout@v3

      # 2. 파이썬을 설치합니다.
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      # 3. (🌟새로 추가된 부분) pip 캐시를 설정합니다.
      - name: Get pip cache dir
        id: pip-cache
        run: |
          echo "dir=$(pip cache dir)" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.pip-cache.outputs.dir }}
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 4. 의존성 패키지를 설치합니다. (캐시가 있으면 매우 빠르게 지나갑니다)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if (Test-Path -Path 'requirements.txt') { pip install -r 'requirements.txt' }
        shell: pwsh

      # 5. Lint로 코드 스타일을 검사합니다.
      - name: Lint with flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      # 6. pytest로 테스트를 실행합니다.
      - name: Test with pytest
        run: pytest
        working-directory: Chapter02