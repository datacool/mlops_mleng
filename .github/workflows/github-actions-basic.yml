name: Python package

on: [push]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: [3.11, 3.13]

    steps:
      # 1. 코드 체크아웃
      - uses: actions/checkout@v3

      # 2. 파이썬 설치
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      # 3. 의존성 패키지 설치 (pytest 포함)
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          # requirements.txt 파일이 있다면 해당 파일의 패키지도 설치
          if (Test-Path -Path 'mlops_mleng/requirements.txt') { pip install -r 'mlops_mleng/requirements.txt' }

      # 4. Lint로 코드 스타일 검사
      - name: Lint with flake8
        run: |
          # flake8를 mlops_mleng 폴더 내부에서 실행
          flake8 ./mlops_mleng --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 ./mlops_mleng --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      # 5. pytest로 테스트 실행 (가장 마지막)
      - name: Test with pytest
        run: pytest
        working-directory: mlops_mleng/Chapter02